<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Registration Form</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    padding:15px;
}

.form-container{
    width:100%;
    max-width:430px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.3);
    border-radius:20px;
    padding:30px 22px;
    box-shadow:0 8px 32px rgba(0,0,0,0.2);
}

.form-header{
    text-align:center;
    color:white;
    margin-bottom:25px;
}

.form-header h2{
    font-size:clamp(24px,5vw,28px);
    margin-bottom:5px;
}

.form-header p{
    font-size:14px;
}

.input-group{
    margin-bottom:18px;
    position:relative;
}

label{
    display:block;
    color:white;
    margin-bottom:6px;
    font-size:14px;
    font-weight:500;
}

input{
    width:100%;
    padding:14px 15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    background:rgba(255,255,255,0.95);
}

input:focus{
    outline:none;
    background:white;
    box-shadow:0 0 0 3px rgba(108,92,231,0.3);
}

.password-toggle{
    position:absolute;
    right:14px;
    top:42px;
    cursor:pointer;
}

.error{
    display:none;
    color:#ff7675;
    font-size:12px;
    margin-top:4px;
}

.success-msg{
    display:none;
    background:#00b894;
    color:white;
    padding:10px;
    border-radius:8px;
    text-align:center;
    margin-bottom:15px;
}

.register-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#6c5ce7,#a29bfe);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.register-btn:hover{
    transform:translateY(-2px);
}

.footer{
    text-align:center;
    margin-top:18px;
    color:rgba(255,255,255,0.8);
    font-size:12px;
}

/* Tablet */
@media (max-width:768px){
    .form-container{
        max-width:100%;
        padding:28px 20px;
    }
}

/* Mobile */
@media (max-width:480px){
    body{
        padding:10px;
        align-items:flex-start;
        padding-top:20px;
    }

    .form-container{
        padding:24px 18px;
        border-radius:16px;
    }

    input{
        font-size:16px;
        padding:13px;
    }

    .register-btn{
        padding:13px;
    }
}
</style>
</head>
<body>

<div class="form-container">

    <div class="form-header">
        <h2>Registration Form</h2>
        <p>Anjali Petwal | Roll No: DD241104301026</p>
    </div>

    <div class="success-msg" id="successMsg">Registration Successful! 🎉</div>

    <form id="regForm" onsubmit="return validateForm()">

        <div class="input-group">
            <label>Name</label>
            <input type="text" id="name" placeholder="Enter your name">
            <div class="error" id="nameError">Name is required</div>
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email address">
            <div class="error" id="emailError">Enter valid email</div>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">
            <span class="password-toggle" onclick="togglePass('password')">👁️</span>
            <div class="error" id="passError">Minimum 8 characters and 1 number required</div>
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <input type="password" id="cpassword" placeholder="Confirm password">
            <span class="password-toggle" onclick="togglePass('cpassword')">👁️</span>
            <div class="error" id="cpassError">Passwords do not match</div>
        </div>

        <button type="submit" class="register-btn">Register</button>
    </form>

    <div class="footer">
        © 2026 Anjali Petwal | WT Lab Practical 7
    </div>
</div>

<script>
function togglePass(id){
    const field = document.getElementById(id);
    field.type = field.type === "password" ? "text" : "password";
}

function validateForm(){
    let isValid = true;

    document.getElementById("successMsg").style.display = "none";
    document.querySelectorAll(".error").forEach(error=>{
        error.style.display = "none";
    });

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("cpassword").value;

    if(name === ""){
        document.getElementById("nameError").style.display = "block";
        isValid = false;
    }

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if(!emailRegex.test(email)){
        document.getElementById("emailError").style.display = "block";
        isValid = false;
    }

    const passRegex = /^(?=.*[0-9]).{8,}$/;
    if(!passRegex.test(password)){
        document.getElementById("passError").style.display = "block";
        isValid = false;
    }

    if(password !== confirmPassword){
        document.getElementById("cpassError").style.display = "block";
        isValid = false;
    }

    if(isValid){
        document.getElementById("successMsg").style.display = "block";

        setTimeout(()=>{
            document.getElementById("regForm").reset();
            document.getElementById("successMsg").style.display = "none";
        },3000);
    }

    return false;
}
</script>

</body>
</html>
